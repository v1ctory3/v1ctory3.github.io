            supporting anti-drone system interoperability.

    Projects:
      - name: Cybersecurity Standards for AI-Based Drones
        start_date: "2026-04"
        end_date: present
        summary: >
          Research on cybersecurity requirements and international
          standardization strategies for the secure operation of
          AI-based drones.
        highlights:
          - >
            Analyze cybersecurity threats, operational risks, and
            security requirements in intelligent and autonomous
            drone environments.

      - name: International Standards for Counter-UAS Interoperability
        start_date: "2025-07"
        end_date: present
        summary: >
          Research on interoperability requirements, architectures,
          data exchange interfaces, and information elements for
          Counter-UAS systems.
        highlights:
          - >
            Support domestic and international standardization
            for interoperable Counter-UAS components.

      - name: Copyright Protection for On-Device AI Models
        start_date: "2025-04"
        end_date: present
        summary: >
          Research on copyright protection and management technologies
          for on-device AI models, including ownership, licensing,
          and distribution requirements.

      - name: Trust Models and Intelligent Breach Response in 6G Open Networks
        start_date: "2024-07"
        end_date: present
        summary: >
          Research on trust models, security mechanisms, and intelligent
          breach response in 6G open network environments.
        highlights:
          - >
            Analyze security threats and attack models in Open RAN
            and 6G network architectures.

      - name: Anti-Drone Standards Conformance Testing
        start_date: "2025-04"
        end_date: "2025-10"
        summary: >
          Research on conformance testing frameworks, test procedures,
          and verification approaches for anti-drone interoperability.

