  summary:
    Ph.D. student in Computer and Information Security at Sejong University and researcher at the
    Protocol Engineering Lab, advised by Prof. Jong-Hyouk Lee. Research focuses on security and trust
    in 5G-Advanced/6G networks, Open RAN and UxNB services, distributed ledger-based trust models, and
    drone and Counter-UAS standardization.
